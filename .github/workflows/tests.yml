name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OPENTAC_SITE_ROOT: ${{ github.workspace }}/.website
    steps:
      - uses: actions/checkout@v4
      - id: website
        run: echo "revision=$(cat website-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: opentac/opentac.github.io
          ref: ${{ steps.website.outputs.revision }}
          path: .website
      - uses: astral-sh/setup-uv@v6
      # demo: design-chat tests; sim: headless MuJoCo physics tests.
      - run: uv sync --locked --extra demo --extra sim
      - run: test -f "$OPENTAC_SITE_ROOT/docs/javascripts/qr.js"
      - run: uv run pytest -q
      - run: uv run python scripts/learn/check_transfer.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t opentac-cad .
      - run: |
          docker run -d --name cad -p 10000:10000 opentac-cad
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:10000/health && exit 0; sleep 2; done
          docker logs cad; exit 1
