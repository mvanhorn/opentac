[project]
name = "opentac"
version = "0.1.0.dev0"
description = "OpenTac: design, build, read and simulate custom tactile sensors"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "tactile sensing", "tactile sensor", "robotics", "flex PCB", "PCB design",
    "KiCad", "piezoresistive", "velostat", "simulation", "MuJoCo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
# Lower bounds are the versions the CAD pipeline was verified with; uv.lock pins exact ones.
dependencies = [
    # CAD tool (opentac.cad)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.12",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "shapely>=2.0.6",
    "ezdxf>=1.3.5",
    "trimesh>=4.12.2",
    # trimesh has no geometry kernel of its own: earcut triangulates, manifold3d
    # does the booleans, networkx is needed by fill_holes (bump sheet repair).
    "mapbox-earcut>=2.0.0",
    "manifold3d>=3.5.2",
    "networkx>=3.6.1",
    # back-silkscreen QR
    "segno>=1.6.6",
    "matplotlib",
    # readout boards (opentac.device)
    "pyserial",
]

[project.urls]
Homepage = "https://opentac.github.io"
Documentation = "https://opentac.github.io/get-started/"
Source = "https://github.com/opentac/opentac.github.io"
Issues = "https://github.com/opentac/opentac.github.io/issues"

[project.optional-dependencies]
# MuJoCo backend for skins with a bump sheet (opentac.sim)
sim = ["mujoco>=3.2"]
# hosted demo only: the Gemini design chat
demo = ["google-genai>=2.20.0", "python-dotenv>=1.2.3"]
# building the website
docs = ["mkdocs-material"]

[project.scripts]
opentac = "opentac.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opentac"]

# The prebuilt firmware goes into the wheel as opentac/device/firmware/, so
# `opentac flash` works from a pip install. firmware/prebuilt/ stays the only
# copy in git (opentac/device/flash.py looks in both places).
[tool.hatch.build.targets.wheel.force-include]
"firmware/prebuilt" = "opentac/device/firmware"

[tool.pytest.ini_options]
testpaths = ["tests"]
